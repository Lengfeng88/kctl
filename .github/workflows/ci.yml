name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (TSan)
        run: |
          cmake -B build-tsan -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O1 -fno-pie" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread -no-pie"

      - name: Build (TSan)
        run: cmake --build build-tsan -j$(nproc)

      - name: Run under ThreadSanitizer (excluding benchmarks)
        run: |
          setarch $(uname -m) -R ./build-tsan/tests/kctl_tests \
            --gtest_filter="-*Compare*:*Benchmark*"
